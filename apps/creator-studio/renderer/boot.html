<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DSH Desktop</title>
  <style>
    :root {
      --bg: #05070f;
      --blue: #4f8cff;
      --cyan: #22d3ee;
      --violet: #8b5cf6;
      --text: #e8eefb;
      --dim: #7d8fb5;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background:
        radial-gradient(50% 40% at 20% 20%, rgba(79,140,255,.16), transparent 70%),
        radial-gradient(45% 38% at 80% 12%, rgba(139,92,246,.12), transparent 70%),
        radial-gradient(55% 45% at 65% 90%, rgba(34,211,238,.09), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
    }
    /* 缓慢流动的极光 */
    body::after {
      content: ""; position: fixed; inset: -20%; pointer-events: none;
      background:
        radial-gradient(38% 30% at 30% 30%, rgba(79,140,255,.12), transparent 65%),
        radial-gradient(32% 28% at 75% 25%, rgba(139,92,246,.10), transparent 65%),
        radial-gradient(40% 34% at 55% 85%, rgba(34,211,238,.08), transparent 65%);
      filter: blur(8px);
      animation: drift 40s ease-in-out infinite alternate;
    }
    @keyframes drift {
      0% { transform: translate3d(-2%,-1%,0) scale(1); }
      100% { transform: translate3d(2%,2%,0) scale(1.08); }
    }

    .stage { position: relative; text-align: center; z-index: 1; }

    /* 能量环 + 中心符号 */
    .core { position: relative; width: 132px; height: 132px; margin: 0 auto 26px; }
    .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1.5px solid rgba(79,140,255,.35);
      animation: pulse-ring 2.6s ease-out infinite;
    }
    .ring:nth-child(2) { animation-delay: .9s; }
    .ring:nth-child(3) { animation-delay: 1.8s; }
    @keyframes pulse-ring {
      0%   { transform: scale(.55); opacity: .9; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    .core-glow {
      position: absolute; inset: 22px; border-radius: 50%;
      background: radial-gradient(circle, rgba(79,140,255,.55), rgba(34,211,238,.18) 55%, transparent 75%);
      filter: blur(2px);
      animation: breathe 3.2s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(.94); opacity: .8; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    .core-icon {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 46px; color: #cfe0ff;
      text-shadow: 0 0 26px rgba(79,140,255,.9);
      animation: breathe 3.2s ease-in-out infinite;
    }

    h1 {
      font-size: 21px; font-weight: 600; letter-spacing: 2px;
      background: linear-gradient(90deg, #cfe0ff, #7fb0ff 45%, #67e8f9);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 6px;
    }
    .sub { font-size: 12px; color: var(--dim); letter-spacing: 3px; margin-bottom: 30px; }

    .status {
      font-size: 13px; color: #a9bce0; min-height: 20px;
      transition: opacity .3s;
    }
    .status .dot { display: inline-block; animation: blink 1.1s infinite; }
    @keyframes blink { 50% { opacity: .25; } }

    /* 进度条 */
    .bar { width: 240px; height: 3px; border-radius: 2px; margin: 18px auto 0; background: #101a30; overflow: hidden; }
    .bar i {
      display: block; height: 100%; width: 40%;
      border-radius: 2px;
      background: linear-gradient(90deg, #4f8cff, #22d3ee);
      box-shadow: 0 0 12px rgba(79,140,255,.8);
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(280%); } }

    .hint { margin-top: 22px; font-size: 11px; color: #5c7094; letter-spacing: 1px; }

    /* 动态壁纸背景 + 暗色压场层 + 底部淡出，内容位居其上 */
  </style>
</head>
<body>
  <div class="stage">
    <div class="core">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="core-glow"></div>
      <div class="core-icon">◈</div>
    </div>
    <h1>达人营销工作台</h1>
    <div class="sub">筛 选 · 邀 约 · 洽 谈 · 对 接 · 审 核 · 发 布 · 复 盘</div>
    <div class="status" id="status">正在唤醒引擎<span class="dot">…</span></div>
    <div class="bar"><i></i></div>
    <div class="hint">DeepSeek Harness · 记忆库 · 多引擎协作</div>
  </div>
  <script>
    const messages = [
      "正在唤醒引擎…",
      "正在连接记忆库…",
      "正在加载技能与插件…",
      "正在校准 MCP 通道…",
      "准备就绪，即将进入工作台…"
    ];
    let i = 0;
    const el = document.getElementById("status");
    const timer = setInterval(() => {
      i = (i + 1) % messages.length;
      el.innerHTML = messages[i] + '<span class="dot">…</span>';
    }, 1600);
    // 外部（主进程）接管后通过 window.__dshBoot?.ready() 结束动画
    window.__dshBoot = {
      setStatus(t) { el.innerHTML = t + '<span class="dot">…</span>'; },
      ready() { clearInterval(timer); el.innerHTML = "✓ " + "引擎就绪"; }
    };
  </script>
</body>
</html>
